<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A smile for you</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    padding: 24px;
    overflow: hidden;
    background: transparent;
  }
  .portrait {
    width: min(76vw, 360px);
    filter: drop-shadow(0 22px 22px rgba(92, 56, 0, .18));
    animation: arrive .75s cubic-bezier(.2,.8,.2,1) both, float 4s ease-in-out .75s infinite;
  }
  .face { fill: #ffd84d; stroke: #3d3017; stroke-width: 7; }
  .cheek { fill: #f59b74; opacity: .55; }
  .eye { fill: #3d3017; transform-box: fill-box; transform-origin: center; animation: blink 4.5s ease-in-out 1.3s infinite; }
  .smile { fill: none; stroke: #3d3017; stroke-width: 9; stroke-linecap: round; }
  .shine { fill: none; stroke: #fff8c7; stroke-width: 8; stroke-linecap: round; opacity: .8; }
  @keyframes arrive { from { opacity: 0; transform: scale(.72) rotate(-8deg); } to { opacity: 1; transform: scale(1) rotate(0); } }
  @keyframes float { 0%,100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-9px) rotate(1deg); } }
  @keyframes blink { 0%,43%,47%,100% { transform: scaleY(1); } 45% { transform: scaleY(.08); } }
  @media (prefers-reduced-motion: reduce) { .portrait, .eye { animation: none; } }
</style>
</head>
<body>
  <svg class="portrait" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
    <title id="title">A cheerful smiley face</title>
    <desc id="desc">A warm yellow face with rosy cheeks, bright eyes, and a big smile.</desc>
    <circle class="face" cx="160" cy="160" r="137"/>
    <path class="shine" d="M72 101c17-34 48-56 83-62"/>
    <ellipse class="eye" cx="111" cy="129" rx="13" ry="19"/>
    <ellipse class="eye" cx="209" cy="129" rx="13" ry="19"/>
    <ellipse class="cheek" cx="84" cy="178" rx="28" ry="15"/>
    <ellipse class="cheek" cx="236" cy="178" rx="28" ry="15"/>
    <path class="smile" d="M91 181c16 45 50 66 69 66s53-21 69-66"/>
  </svg>
</body>
</html>
