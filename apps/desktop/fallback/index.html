<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ocode setup required</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-tauri-drag-region="deep">
    <main>
      <h1>Forge URL not configured</h1>
      <p>
        Set <code>OCODE_FORGE_URL</code> to the HTTPS URL where Forge is exposed through
        Tailscale Serve, then restart ocode.
      </p>
      <p>Only valid <code>https://*.ts.net</code> origins are accepted.</p>
    </main>
  </body>
</html>
